[project]
name = "fitdocs"
version = "0.1.0"
description = "Decode .fit files into a typed activity model with derived metrics (pure library layer)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "garmin-fit-sdk>=21.208.0",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
]

[project.scripts]
fitdocs = "fitdocs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitdocs"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "markdown-it-py>=3.0",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# Every module holding a LoadCalculator- or TileSource-shaped stub is in scope,
# so a Protocol signature change in src/ reddens every stub that did not move
# with it. That perimeter is the point: training-load task 3.3 took `compute`
# from four parameters to five and every stub was migrated by hand with the
# suite staying green throughout, because nothing type-checked them. When this
# was first measured, six stubs had already drifted -- `required_athlete_fields`
# returning `tuple[object, ...]`, which does not satisfy
# `tuple[AthleteField, ...]` because return types are covariant. (Sibling
# `activity: object` / `profile: object` parameters on the same stubs are legal:
# parameter types are contravariant, so `object` always conforms. Do not use
# `object` to verify this guard -- it will not fail. Change a stub's
# `context: LoadContext` to `context: str` instead.)
#
# Add a module here and fix its errors in the same change: adding it first makes
# the Definition of Done red for every other change in flight.
files = [
    "src",
    "tests/_content_oracle.py",
    "tests/_content_fingerprints.py",
    "tests/test_content_oracle.py",
    "tests/test_content_fingerprints_shape.py",
    "tests/test_provenance_record.py",
    "tests/_forbidden_strings.py",
    "tests/test_forbidden_strings.py",
    "tests/test_citation.py",
    "tests/load/conftest.py",
    "tests/load/test_types.py",
    "tests/load/test_arbitrate.py",
    "tests/test_contributing_calculators_doc.py",
    "tests/test_docs_guarantees.py",
    "tests/load/test_engine.py",
    "tests/load/test_arbitration_e2e.py",
    "tests/load/test_registry.py",
    "tests/test_cli.py",
    "tests/test_plugin_regression.py",
    "tests/metrics/test_sources.py",
    "tests/metrics/test_constant_guard.py",
    "tests/performance/test_types.py",
    "tests/performance/test_sources.py",
    "tests/performance/test_models.py",
    "tests/performance/test_constant_guard.py",
    "tests/performance/test_derive.py",
    "tests/performance/test_engine.py",
    "tests/performance/test_purity.py",
    "tests/performance/test_reachability.py",
    "tests/test_cli_derive.py",
    "tests/performance/test_single_writer.py",
    "tests/plans/test_model.py",
    "tests/plans/test_source.py",
    "tests/plans/test_resolution.py",
    "tests/plans/test_boundary.py",
    # plan-resolution task 3.3: design.md "PackageBoundary and SurfacePins"
    # names only four (test_corpus.py, test_matching.py, test_aggregate.py,
    # test_reconcile.py) -- but the package has FIVE new modules (corpus,
    # matching, aggregate, placement, reconcile), and a fifth typed test
    # module, tests/plans/test_placement.py, already exists on disk. Listed
    # here too (the design's own omission, not repeated) -- all five were
    # confirmed mypy-clean before being added.
    "tests/plans/test_corpus.py",
    "tests/plans/test_matching.py",
    "tests/plans/test_aggregate.py",
    "tests/plans/test_placement.py",
    "tests/plans/test_reconcile.py",
    "tests/test_skill_locator.py",
    "tests/test_cli_skill.py",
    "tests/test_agent_skill.py",
    "tests/test_skill_wheel.py",
    "tests/test_skill_e2e.py",
    "tests/test_version_identity.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
