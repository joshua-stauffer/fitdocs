[project]
name = "fitdocs-relay"
version = "0.1.0"
description = "A small self-hostable relay that holds a platform application for fitdocs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
    "cryptography>=44,<51",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
fitdocs-relay = "fitdocs_relay.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitdocs_relay"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests", "conftest.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
