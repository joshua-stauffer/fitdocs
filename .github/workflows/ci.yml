# Continuous integration (task 6.2; design.md "CiWorkflow and
# ReleaseWorkflow"; Requirements 5.2, 6.9).
#
# Runs on every push and pull request: the same three quality gates
# CONTRIBUTING.md's "The three quality gates" section documents, then a
# build and the artifact conformance / encumbered-content checks, so a
# manifest edit that would break a release fails here rather than at
# release time. This is the `gates` job docs/releasing.md's "1. Quality
# gates" step names as the automation that runs those exact three
# commands; the build and check steps here mirror steps 4-5 of that
# procedure, run with `--no-version-check` because the real CHANGELOG.md
# has no released entry until the first release (task 2.4's note).
#
# A second job, `supported-pythons`, runs the test suite alone on every other
# interpreter pyproject.toml classifies (3.12, 3.13): interpreter-dependent
# behaviour (pathlib's attribute set, Path.stat call counts) otherwise
# reaches a release untested. The quality gates, build and artifact checks
# stay on the floor interpreter, once, in `gates`.
#
# The match data is written before the test suite so the suite's own
# forbidden-strings scan of every tracked file runs in `gates` too (it skips
# when `FITDOCS_FORBIDDEN_STRINGS` is unset). `supported-pythons` holds no
# secret and skips that scan, which does not vary by interpreter; a fork PR
# stops `gates` at the write step but still gets its 3.12 and 3.13 results.
#
# Publishes nothing: no publishing credential, no OIDC identity-token
# permission grant, no publish job. The encumbered-content gate's match
# data is supplied from the `FITDOCS_FORBIDDEN_STRINGS_CONTENT` repository
# secret (task 6.1), written to a runner-local file OUTSIDE the checkout so
# the guard never reads from inside the repository -- and the last step in
# this job re-proves, on every run, that an absent secret fails the gate
# closed (`gate_not_run`) rather than silently passing (Requirement 6.9,
# Amendment 2).

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # typer forces rich's terminal rendering whenever GITHUB_ACTIONS is set,
  # which inserts ANSI styling into `--help` output and breaks the plain-text
  # help assertions in tests/. A dumb terminal renders the same plain text
  # a developer's non-tty pytest run sees. NO_COLOR is the public convention
  # for the same intent and is kept alongside it.
  TERM: dumb
  NO_COLOR: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      # A pull request from a fork never sees this repository's secrets --
      # GitHub redacts them to an empty string for fork-triggered runs. That
      # means a fork PR fails here, by design: the encumbered-content gate
      # cannot run without its match data, and an unrun gate is exactly the
      # `gate_not_run` failure this step reports (Requirement 6.9). There is
      # no fork-specific skip; the gate is fail-closed for every trigger.
      - name: Write the match data outside the checkout
        env:
          FITDOCS_FORBIDDEN_STRINGS_CONTENT: ${{ secrets.FITDOCS_FORBIDDEN_STRINGS_CONTENT }}
        run: |
          if [ -z "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" ]; then
            echo "::error::gate_not_run: FITDOCS_FORBIDDEN_STRINGS_CONTENT secret is not set; the encumbered-content gate cannot run"
            exit 1
          fi
          printf '%s' "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" > "$RUNNER_TEMP/forbidden-strings.txt"

      # Defense in depth: this repository's Actions log is public and the
      # suite below runs armed. The guard tests report no matched value, but
      # if anything ever printed one the runner would replace it with ***.
      # Same parse as tests/_forbidden_strings.py: skip blank and `#` lines,
      # take the text after the first tab. Kept a separate step so the write
      # step stays byte-identical to docs.yml's.
      - name: Mask the match data in the log
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in "" | "#"*) continue ;; esac
            case "$line" in
              *$'\t'*) value="${line#*$'\t'}" ;;
              *) value="$line" ;;
            esac
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
          done < "$RUNNER_TEMP/forbidden-strings.txt"

      # The match data written above also arms the suite's own
      # forbidden-strings guard (tests/_forbidden_strings.py): unset, it skips
      # its scan of every tracked file, so a new doc or fixture would merge
      # unscanned. `runner.temp` is the same directory as `$RUNNER_TEMP`.
      - name: Run the test suite
        env:
          FITDOCS_FORBIDDEN_STRINGS: ${{ runner.temp }}/forbidden-strings.txt
        run: uv run pytest

      - name: Lint and check formatting
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run the strict type check
        run: uv run mypy

      - name: Build the artifacts
        run: uv run python -m scripts.build_release --out-dir dist

      - name: Check the artifacts
        run: FITDOCS_FORBIDDEN_STRINGS="$RUNNER_TEMP/forbidden-strings.txt" uv run python -m scripts.check_artifacts --no-version-check --dist-dir dist

      - name: Prove the gate fails closed
        run: |
          set +e
          out=$(env -u FITDOCS_FORBIDDEN_STRINGS uv run python -m scripts.check_artifacts --no-version-check --dist-dir dist 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 with the match data unset, got $rc"
            exit 1
          fi
          if ! grep -q gate_not_run <<<"$out"; then
            echo "::error::expected gate_not_run in the output when the match data is unset"
            exit 1
          fi

      - name: Upload the built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The test suite on the supported interpreters above the floor. `UV_PYTHON`
  # makes every uv command in the job use the matrix interpreter: without it
  # the repository's `.python-version` (3.11) would silently win and this
  # job would test the floor three times.
  supported-pythons:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install the matrix Python
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync

      - name: Confirm the interpreter under test
        run: uv run python -c "import sys; assert '%d.%d' % sys.version_info[:2] == '${{ matrix.python }}', sys.version"

      # Deliberately unarmed: no secret, so fork PRs keep their 3.12/3.13
      # results. The forbidden-strings scan does not depend on the
      # interpreter; `gates` (3.11) runs it, and these runs skip its tests.
      - name: Run the test suite
        run: uv run pytest
