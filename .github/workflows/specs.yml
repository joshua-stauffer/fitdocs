# Spec-only changes. A push or pull request that changes only files under
# `.kiro/specs/` skips ci.yml (its `paths-ignore`) and runs this workflow
# instead. A change that also touches anything else runs both.
#
# It keeps the one gate that only CI can run: the encumbered-content scan of
# every tracked file (tests/test_forbidden_strings.py, armed by the match
# data from the `FITDOCS_FORBIDDEN_STRINGS_CONTENT` secret, written outside
# the checkout by the same fail-closed step ci.yml uses). It also runs the
# test files that read spec text:
# - tests/test_docs_guarantees.py (plugin-api's design.md);
# - tests/connectors/test_wellness_records.py (amendment records in
#   requirements.md).
# A new test that reads `.kiro/specs/` joins the list in the test step and in
# tests/test_specs_workflow.py.
#
# Publishes nothing: no publishing credential, no OIDC identity-token
# permission grant, no upload.

on:
  push:
    paths: &spec_only
      - ".kiro/specs/**"
  pull_request:
    paths: *spec_only

permissions:
  contents: read

env:
  TERM: dumb
  NO_COLOR: "1"

jobs:
  spec-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Write the match data outside the checkout
        env:
          FITDOCS_FORBIDDEN_STRINGS_CONTENT: ${{ secrets.FITDOCS_FORBIDDEN_STRINGS_CONTENT }}
        run: |
          if [ -z "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" ]; then
            echo "::error::gate_not_run: FITDOCS_FORBIDDEN_STRINGS_CONTENT secret is not set; the encumbered-content gate cannot run"
            exit 1
          fi
          printf '%s' "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" > "$RUNNER_TEMP/forbidden-strings.txt"

      # Defense in depth: this repository's Actions log is public and the
      # suite below runs armed. The guard tests report no matched value, but
      # if anything ever printed one the runner would replace it with ***.
      # The same parse as tests/_forbidden_strings.py for ordinary text lines:
      # skip blank and `#` lines, take the text after the first tab. Kept a separate step so the write
      # step stays byte-identical to docs.yml's.
      - name: Mask the match data in the log
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in "" | "#"*) continue ;; esac
            case "$line" in
              *$'\t'*) value="${line#*$'\t'}" ;;
              *) value="$line" ;;
            esac
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
          done < "$RUNNER_TEMP/forbidden-strings.txt"

      - name: Run the scan and the spec-reading tests
        env:
          FITDOCS_FORBIDDEN_STRINGS: ${{ runner.temp }}/forbidden-strings.txt
        run: uv run pytest tests/test_forbidden_strings.py tests/test_docs_guarantees.py tests/connectors/test_wellness_records.py
