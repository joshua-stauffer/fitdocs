# Release (task 6.3, task 6.4; design.md "CiWorkflow and ReleaseWorkflow",
# "Release pipeline"; Requirements 2.5, 5.2, 5.3, 5.5, 5.6, 5.7, 5.8, 5.9,
# 5.10).
#
# Triggered by a version tag. A chain of dependent jobs, each `needs:` the
# one before it, so any job's failure prevents every later job from running
# at all (5.8) -- publication is unreachable unless every gate passed. Every
# gate invokes the project's own script or test command, the same ones
# docs/releasing.md's manual procedure names step by step (5.10), so the
# automated path and the documented manual path execute identical logic.
#
# `gates`, `version`, `build`, `check`, `verify-artifact` (task 6.3) are the
# gate chain: they publish nothing and require no credential, so they are
# independently runnable and independently verifiable. `publish-testpypi`,
# `publish-pypi`, `verify-published` (task 6.4) publish the rehearsal
# artifact, publish the public artifact behind the `pypi` environment's
# manual approval, and confirm the public index serves the tagged version --
# each authenticates by a short-lived, per-release OIDC identity-token
# exchange scoped to that job alone (Req 5.7), never to this file's
# top-level `permissions:` block below, and the publish jobs stay inline
# rather than a reusable workflow, because trusted publishing does not work
# from one.

on:
  push:
    tags:
      - "v*"

# Scoped to read-only for every job. Each of the three task 6.4 jobs
# declares its own job-scoped `permissions:` for the short-lived OIDC
# credential exchange or its absence (Req 5.7) -- this top-level block is
# never widened for them.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Run the test suite
        run: uv run pytest

      - name: Lint and check formatting
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run the strict type check
        run: uv run mypy

  version:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      # Before any build: the tag, the manifest, and the changelog's newest
      # released entry must all agree (design.md decision (b)). GITHUB_REF_NAME
      # is the tag name for a tag-triggered run (e.g. "v0.1.0").
      - name: Check the version against the tag
        run: uv run python -m scripts.check_artifacts --no-artifacts --tag "${GITHUB_REF_NAME}"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Build the artifacts
        run: uv run python -m scripts.build_release --out-dir dist

      - name: Upload the built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Same guard as the CI workflow's `gates` job: an absent secret is
      # never a silent pass. Written OUTSIDE the checkout so the guard never
      # reads its own match data from inside the repository (Req 6.3, 6.9).
      - name: Write the match data outside the checkout
        env:
          FITDOCS_FORBIDDEN_STRINGS_CONTENT: ${{ secrets.FITDOCS_FORBIDDEN_STRINGS_CONTENT }}
        run: |
          if [ -z "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" ]; then
            echo "::error::gate_not_run: FITDOCS_FORBIDDEN_STRINGS_CONTENT secret is not set; the encumbered-content gate cannot run"
            exit 1
          fi
          printf '%s' "$FITDOCS_FORBIDDEN_STRINGS_CONTENT" > "$RUNNER_TEMP/forbidden-strings.txt"

      # The full default checker: both the artifact-conformance gate and the
      # version-consistency gate run again here, against the tag, this time
      # with the real artifacts on disk (neither --no-version-check nor
      # --no-artifacts) -- docs/releasing.md step 5's exact command.
      - name: Check the artifacts
        run: FITDOCS_FORBIDDEN_STRINGS="$RUNNER_TEMP/forbidden-strings.txt" uv run python -m scripts.check_artifacts --tag "${GITHUB_REF_NAME}" --dist-dir dist

  verify-artifact:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Installs from the BUILT ARTIFACT, never the working tree (design.md
      # decision (c)) -- no checkout, no `uv sync`, nothing beyond uv itself
      # and the downloaded wheel. The tool-directory variables are exported
      # BEFORE the install so both the install and every later invocation in
      # this same step see them; the binary is invoked by its full path
      # inside $UV_TOOL_BIN_DIR (never bareword), exactly as
      # docs/releasing.md's step 6 does, because $UV_TOOL_BIN_DIR is
      # deliberately not on PATH. Kept to --version/--help/plugins to stay
      # hermetic (needs no data root); the full ingestion checkpoint is
      # `tests/test_release_artifacts.py -k checkpoint`, which the `gates`
      # job above already ran as part of the full test suite.
      - name: Install and smoke-test the built artifact
        run: |
          export UV_TOOL_DIR=$(mktemp -d)
          export UV_TOOL_BIN_DIR=$(mktemp -d)
          uv tool install --from dist/fitdocs-*.whl fitdocs
          "$UV_TOOL_BIN_DIR/fitdocs" --version
          "$UV_TOOL_BIN_DIR/fitdocs" --help
          "$UV_TOOL_BIN_DIR/fitdocs" plugins
          test "$("$UV_TOOL_BIN_DIR/fitdocs" --version)" = "${GITHUB_REF_NAME#v}"

  publish-testpypi:
    needs: verify-artifact
    runs-on: ubuntu-latest
    # The rehearsal environment carries no required reviewer (task 6.1), so
    # this job runs automatically once the whole gate chain has passed
    # (design decision (a): every failing gate runs before any publish, so a
    # failure never spends a version number).
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fitdocs/
    # Job-scoped identity-token permission for the short-lived, per-release
    # OIDC credential exchange (Req 5.7) -- no `contents` grant, and no
    # long-lived secret anywhere in or alongside the project.
    permissions:
      id-token: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pinned to the immutable release tag v1.14.2 -- verified via
      # `gh api repos/pypa/gh-action-pypi-publish/git/ref/tags/v1.14.2`
      # (reports SHA a892a5a61159132606e93a2fa6f4358831b04d26) and
      # `gh api repos/pypa/gh-action-pypi-publish/releases/tags/v1.14.2`
      # (reports `"immutable": true` on that release), never the floating
      # `release/v1` alias. Uses trusted publishing (no `password:` input),
      # so this step alone needs `id-token: write` above. `skip-existing` is
      # explicit `false` here too -- the action's own default -- so a
      # rehearsal re-run of an already-spent rehearsal version fails rather
      # than silently skipping, matching docs/releasing.md step 8's "a spent
      # rehearsal version is not reused" (2.5 applies to the rehearsal index
      # too, not only the public one). PEP 740 attestations are generated
      # and uploaded by default since v1.11.0; pinned explicitly `true` so a
      # future default flip cannot silently disable them.
      - name: Publish to the rehearsal index (TestPyPI)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false
          attestations: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # The approval gate lives on the ENVIRONMENT, not on this job's YAML
    # (design decision (d)): the `pypi` environment (task 6.1) requires a
    # maintainer's manual approval in the repository's Actions UI before any
    # step below runs -- there is no manual publish command to run by hand.
    environment:
      name: pypi
      url: https://pypi.org/project/fitdocs/
    permissions:
      id-token: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Default repository (PyPI, no repository-url override). skip-existing
      # is set explicitly to false -- the action's own default -- so a
      # re-run of an already-published version number FAILS rather than
      # silently skipping (Req 2.5, design decision "does not tolerate an
      # already-present version"). attestations pinned explicitly `true`
      # for the same reason as the rehearsal job above.
      - name: Publish to the public index (PyPI)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true

  verify-published:
    needs: publish-pypi
    runs-on: ubuntu-latest
    # No identity-token permission: this job authenticates nothing and
    # publishes nothing, it only installs a public, already-released
    # artifact. Explicit `contents: read` (redundant with the top-level
    # block) rather than an omitted key, so the "no id-token anywhere
    # outside the two publish jobs" property is visible on this job too.
    permissions:
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      # No checkout of the source and no download of the built artifact
      # (design decision (c) applies here too, at the far end of the
      # pipeline): this job proves the PUBLIC INDEX now serves the tagged
      # version, not that yesterday's local wheel still works. The bounded
      # retry tolerates ordinary index-propagation delay right after a
      # publish; a failure after the retries is a defect report, never a
      # re-publish, because the version is already spent (design decision
      # (e), Req 2.5).
      - name: Install and verify the published version from the public index
        run: |
          export UV_TOOL_DIR=$(mktemp -d)
          export UV_TOOL_BIN_DIR=$(mktemp -d)
          for i in 1 2 3 4 5 6; do uv tool install --no-cache "fitdocs==${GITHUB_REF_NAME#v}" && break; sleep 30; done
          test -x "$UV_TOOL_BIN_DIR/fitdocs"
          test "$("$UV_TOOL_BIN_DIR/fitdocs" --version)" = "${GITHUB_REF_NAME#v}"
          "$UV_TOOL_BIN_DIR/fitdocs" --help
