<svg xmlns="http://www.w3.org/2000/svg" width="720" height="246" viewBox="0 0 720 246" role="img" font-family="sans-serif"><title>Shoe mileage</title><desc>Small-multiples chart: Shoe mileage. No data: none of the 2 rows has a value to draw.</desc><style>@media (prefers-color-scheme:light){.ck-t{fill:#707070}.ck-s{stroke:#707070}}@media (prefers-color-scheme:dark){.ck-t{fill:#8e8e8e}.ck-s{stroke:#8e8e8e}}</style><text x="8" y="21" font-size="13" class="ck-t" fill="#7f7f7f">Shoe mileage</text><text x="360" y="123" text-anchor="middle" font-size="13" class="ck-t" fill="#7f7f7f">No data</text><text x="360" y="141" text-anchor="middle" font-size="11" class="ck-t" fill="#7f7f7f">None of the 2 rows has a value to draw.</text></svg>