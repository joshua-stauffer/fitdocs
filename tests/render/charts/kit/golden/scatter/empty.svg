<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" font-family="sans-serif"><title>Elevation by distance</title><desc>Scatter chart: Elevation by distance. No data: no rows.</desc><style>@media (prefers-color-scheme:light){.ck-t{fill:#707070}.ck-s{stroke:#707070}}@media (prefers-color-scheme:dark){.ck-t{fill:#8e8e8e}.ck-s{stroke:#8e8e8e}}</style><text x="8" y="21" font-size="13" class="ck-t" fill="#7f7f7f">Elevation by distance</text><text x="360" y="180" text-anchor="middle" font-size="13" class="ck-t" fill="#7f7f7f">No data</text></svg>