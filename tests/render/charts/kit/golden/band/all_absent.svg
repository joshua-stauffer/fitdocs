<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" font-family="sans-serif"><title>Heart rate spread</title><desc>Band chart: Heart rate spread. No data: none of the 5 rows has a value to draw.</desc><style>@media (prefers-color-scheme:light){.ck-t{fill:#707070}.ck-s{stroke:#707070}}@media (prefers-color-scheme:dark){.ck-t{fill:#8e8e8e}.ck-s{stroke:#8e8e8e}}</style><text x="8" y="21" font-size="13" class="ck-t" fill="#7f7f7f">Heart rate spread</text><text x="360" y="160" text-anchor="middle" font-size="13" class="ck-t" fill="#7f7f7f">No data</text><text x="360" y="178" text-anchor="middle" font-size="11" class="ck-t" fill="#7f7f7f">None of the 5 rows has a value to draw.</text></svg>