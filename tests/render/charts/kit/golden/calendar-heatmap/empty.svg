<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" font-family="sans-serif"><title>Daily distance</title><desc>Calendar-heatmap chart: Daily distance. No data: no rows.</desc><style>@media (prefers-color-scheme:light){.ck-t{fill:#707070}.ck-s{stroke:#707070}}@media (prefers-color-scheme:dark){.ck-t{fill:#8e8e8e}.ck-s{stroke:#8e8e8e}}</style><text x="8" y="21" font-size="13" class="ck-t" fill="#7f7f7f">Daily distance</text><text x="360" y="80" text-anchor="middle" font-size="13" class="ck-t" fill="#7f7f7f">No data</text></svg>