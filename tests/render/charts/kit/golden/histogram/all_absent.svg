<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" font-family="sans-serif"><title>Run distances</title><desc>Histogram chart: Run distances. No data: none of the 3 rows has a value to draw.</desc><style>@media (prefers-color-scheme:light){.ck-t{fill:#707070}.ck-s{stroke:#707070}}@media (prefers-color-scheme:dark){.ck-t{fill:#8e8e8e}.ck-s{stroke:#8e8e8e}}</style><text x="8" y="21" font-size="13" class="ck-t" fill="#7f7f7f">Run distances</text><text x="360" y="140" text-anchor="middle" font-size="13" class="ck-t" fill="#7f7f7f">No data</text><text x="360" y="158" text-anchor="middle" font-size="11" class="ck-t" fill="#7f7f7f">None of the 3 rows has a value to draw.</text></svg>