[project]
name = "fitdocs-fixture-calc"
version = "9.9.9"
description = "Minimal installable fixture distribution advertising a trivial RUN load calculator via the fitdocs.load_calculators entry-point group, used only by tests/test_plugins_install.py to prove keyless discovery works against a real install."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."fitdocs.load_calculators"]
fixture = "fitdocs_fixture_calc:FixtureCalculator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["fitdocs_fixture_calc.py"]
