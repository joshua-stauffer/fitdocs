# The reconciliation fixture (plan-resolution tasks.md 2.4). One block, four
# mesocycles (2026-02-02..2026-03-01, mesocycle_days = 7), whose eleven rows
# and paired corpus (built directly in `tests/plans/test_placement.py`,
# never through a filesystem scan) exercise the row and mesocycle cases
# tasks.md 2.4 enumerates for the goldens -- exact, absorbed three, an
# ambiguous pair, overridden with one missing stem, skipped with a reason,
# not logged with a same-day competitor, upcoming; one complete mesocycle
# with a target, one lower bound with an exclusion, one not computed, one
# with unplanned. Grammar rows this fixture does not reach (a no-pages
# mesocycle, an unclaimed same-day bullet, a no-reason override or skip)
# are covered by hand-built `BlockReconciliation`/`RowOutcome` values in
# `test_placement.py`'s own unit tests, not by this fixture.
#
# - "w1-mon" (2026-02-02, Run): MATCHED exact.
# - "w1-tue" (2026-02-03, Ride): MATCHED absorbed (three logged rides).
# - "w1-wed-run" (2026-02-04, Run): NOT_LOGGED, same-day Ride taken by
#   "w1-wed-ride" -- no logged Run that day at all, so no competitors.
# - "w1-wed-ride" (2026-02-04, Ride): MATCHED exact.
# - "w1-fri-a" / "w1-fri-b" (2026-02-06, Run): a competing pair -- one
#   logged Run that day, "w1-fri-a" (declared first) wins it (MATCHED,
#   confidence ambiguous); "w1-fri-b" is NOT_LOGGED (confidence is only set
#   on a MATCHED row, so only "w1-fri-a" ever appears in `.ambiguous`),
#   naming "w1-fri-a" as the assignee.
# - "w2-mon" (2026-02-09, Run): OVERRIDDEN, naming one existing stem
#   ("w2-existing-log") and one missing stem ("w2-missing-log", reported as
#   a problem) -- with a reason.
# - "w2-tue" (2026-02-10, Run): SKIPPED, with a reason.
# - "w2-wed" (2026-02-11, Run): MATCHED exact, claims the mesocycle 2
#   unscored page so it is never also "unplanned".
# - "w2-thu" (2026-02-12, Run): MATCHED exact, claims the mesocycle 2
#   excluded (other-methodology) page so it is never also "unplanned".
# - "w4-thu" (2026-02-26, Run): UPCOMING -- dated on/after the fixture's
#   `today` (2026-02-24), no logged workout and no same-day competitor.
#
# Mesocycle 1 (2026-02-02..2026-02-08, target 300): every dated page
# scored under the chosen methodology -- "complete, with a target".
# Mesocycle 2 (2026-02-09..2026-02-15, target 250): one scored, one
# unscored, one excluded (scored under another methodology) -- "lower
# bound, with an exclusion".
# Mesocycle 3 (2026-02-16..2026-02-22, no target): three unclaimed pages --
# two unscored ("none scored", not computed) and one scored under another
# methodology, which is both unplanned (no row claims it) and excluded
# (scored under "banister" rather than the chosen "threshold"): "with
# unplanned" together with "with excluded" on the same mesocycle, the case
# the after-table blank-line separation between the two listings pins.
# Mesocycle 4 (2026-02-23..2026-03-01, no target): one scored, unclaimed
# page -- "with unplanned" again, cleanly (no override, unplanned or
# excluded workout in this fixture is dated 2026-02-24, the fixture's
# `today` -- the no-today postcondition's own precondition).

title = "Reconcile fixture block"
starts = 2026-02-02
ends = 2026-03-01
goal = "A block built to exercise every reconciliation grammar row."
mesocycle_days = 7

[[mesocycle]]
number = 1
